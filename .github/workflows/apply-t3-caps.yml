name: apply-t3-caps
on:
  push:
    branches: [feature/oppressor-counterplay]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply T3 caps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def insert_once(text, anchor, insertion):
              if insertion in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f"anchor not found: {anchor!r}")
              return text.replace(anchor, insertion + anchor, 1)
          p = Path('Resources/Prototypes/_RMC14/Entities/Mobs/Xeno/crusher.yml')
          s = p.read_text()
          s = insert_once(s, '  - type: GuideHelp\n', '  - type: XenoEvolutionCapped\n    id: RMCXenoCrusher\n    max: 3\n')
          p.write_text(s)
          p = Path('Resources/Prototypes/_RMC14/Entities/Mobs/Xeno/ravager.yml')
          s = p.read_text()
          s = insert_once(s, '  - type: GuideHelp\n', '  - type: XenoEvolutionCapped\n    id: RMCXenoRavager\n    max: 3\n')
          p.write_text(s)
          p = Path('Resources/Prototypes/_RMC14/Entities/Mobs/Xeno/praetorian.yml')
          s = p.read_text()
          s = insert_once(s, '  - type: Sprite\n    sprite: _RMC14/Mobs/Xenonids/Praetorian/praetorian.rsi\n', '  - type: XenoEvolutionCapped\n    id: RMCXenoPraetorian\n    max: 6\n')
          for strain in ('RMCXenoPraetorianDancer','RMCXenoPraetorianOppressor','RMCXenoPraetorianVanguard','RMCXenoPraetorianValkyrie'):
              s = insert_once(s, f'  id: {strain}\n  suffix:', f'  - type: XenoEvolutionCapped\n    id: {strain}\n    max: 2\n')
          p.write_text(s)
          wf = Path('.github/workflows/apply-t3-caps.yml')
          if wf.exists(): wf.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Resources/Prototypes/_RMC14/Entities/Mobs/Xeno/crusher.yml Resources/Prototypes/_RMC14/Entities/Mobs/Xeno/ravager.yml Resources/Prototypes/_RMC14/Entities/Mobs/Xeno/praetorian.yml .github/workflows/apply-t3-caps.yml
          git commit -m 'Adjust T3 Xeno evolution caps'
          git push
